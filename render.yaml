# Render Blueprint: New + → Blueprint → this repository. Free web service running the Flask app.
services:
  - type: web
    name: umbral-crisp-ml
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn app.app:app --workers 1 --threads 4 --timeout 120
    healthCheckPath: /api/health
    envVars:
      - key: PYTHON_VERSION
        value: 3.14.7
      # Activity 2 - information system. Values are set in Render (never in the repository):
      - key: SECRET_KEY            # signs the session cookie
        generateValue: true
      - key: DATABASE_URL          # Supabase → Connect → Session pooler (PostgreSQL URI with the password)
        sync: false
      - key: ADMIN_USERNAME        # first administrator, created on start-up if there is none
        sync: false
      - key: ADMIN_PASSWORD
        sync: false
